services:

  # ──────────────────────────────────────────────────────────────
  # Interface
  # ──────────────────────────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "3000:8080"          # seule interface exposée côté hôte
    environment:
      - WEBUI_AUTH=true
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY}   # fixe : sans ça, chaque recréation du conteneur invalide les sessions
      - ENABLE_OPENAI_API=true
      - OPENAI_API_BASE_URL=http://langgraph-agent:8000/v1
    volumes:
      - open-webui-data:/app/backend/data
    depends_on:
      - langgraph-agent
    networks:
      - agent-net

  # ──────────────────────────────────────────────────────────────
  # Orchestration globale
  # ──────────────────────────────────────────────────────────────
  langgraph-agent:
    build: ./services/langgraph-agent
    container_name: langgraph-agent
    restart: unless-stopped
    environment:
      # Conscience temporelle (PLAN.md Phase 1, point 7a, voir docs/history.md) :
      # un conteneur Docker tourne en UTC par défaut, jamais le fuseau de
      # l'hôte automatiquement — défaut Europe/Paris (fuseau de ce
      # déploiement, vérifié via `timedatectl` sur l'hôte), surchargeable
      # via .env si l'hôte change.
      - TZ=${TZ:-Europe/Paris}
      - LLM_BASE_URL=${LLM_BASE_URL:-http://tabbyapi:5000/v1}
      - SKILL_MANAGER_URL=http://skill-manager:8001
      - CONTEXT_MANAGER_URL=http://context-manager:8002
      - MCP_CLIENT_URL=http://mcp-client:8003
      # Journal d'audit des tool_calls TIER_REVERSIBLE (Phase 2, voir README
      # section Supervision humaine) : /workspace/.audit, sur le même bind
      # mount que les autres serveurs MCP filesystem/git/terminal.
      - AUDIT_LOG_DIR=/workspace/.audit
      # Conversion PNG par défaut (aucune valeur = passe par _to_png_data_uri) :
      # le backend par défaut (TabbyAPI/ExLlamaV3) n'est pas connu pour décoder
      # le WebP nativement (à vérifier empiriquement, voir plan d'implémentation
      # tabbyapi). "webp" ne s'active que pour le backend alternatif
      # llama-server, dont le fork llama.cpp décode le WebP nativement — voir
      # tableau des bugs du README.
      - IMAGE_FORMAT_PASSTHROUGH=${IMAGE_FORMAT_PASSTHROUGH:-}
      # Qwen3.6 raisonne par défaut sur chaque tour : coûteux pour une
      # boucle rapide d'outils auto-approuvés. Injecte /no_think
      # dans le system prompt quand tous les tool_calls du tour précédent
      # sont auto-approuvés (voir approval_policy.py) ; laisse le
      # raisonnement normal sinon (première décision d'un tour, tool
      # sensible...). Voir app/graph.py, _adaptive_thinking_directive.
      - ADAPTIVE_THINKING=${ADAPTIVE_THINKING:-true}
      # Plan explicite (Phase 1 « cœur cognitif », Itération 1 — voir
      # docs/briefs/phase-1-coeur-cognitif.md et README, section "Plan
      # explicite"). DÉFAUT INVERSÉ (docs/briefs/flags-du-coeur-cognitif.md,
      # voir app/graph.py) : le cœur cognitif est mesuré et adopté (campagne
      # finale 29/33), c'est la DÉSACTIVATION qui doit être explicite —
      # ATTENTION : ce défaut doit rester cohérent avec celui d'app/graph.py
      # ($PLANNER_ENABLED non défini dans .env retomberait sinon sur CE
      # défaut-ci, pas sur celui du code Python).
      - PLANNER_ENABLED=${PLANNER_ENABLED:-true}
      # Vérification post-action + budget d'échec (Itération 2 — voir
      # docs/briefs/phase-1-coeur-cognitif.md et README, section "Plan
      # explicite"). N'A D'EFFET QUE SI PLANNER_ENABLED EST AUSSI true.
      # DÉFAUT INVERSÉ, même justification que PLANNER_ENABLED ci-dessus.
      - VERIFICATION_ENABLED=${VERIFICATION_ENABLED:-true}
      # Tentatives par sous-tâche avant de la marquer "echoue" (voir
      # verify_action, app/graph.py).
      - SUBTASK_ATTEMPT_BUDGET=${SUBTASK_ATTEMPT_BUDGET:-3}
      # Replanifications tolérées pour une même tâche avant un rapport
      # d'échec honnête plutôt qu'une boucle infinie (voir replan_task/
      # report_failure, app/graph.py).
      - REPLAN_BUDGET=${REPLAN_BUDGET:-2}
      # Pipeline de validation du plan (Itération 3 — voir
      # docs/briefs/phase-1-coeur-cognitif.md et README, section "Plan
      # explicite"). N'A D'EFFET QUE SI PLANNER_ENABLED EST AUSSI true.
      # DÉFAUT INVERSÉ, même justification que PLANNER_ENABLED ci-dessus.
      - PLAN_VALIDATION_ENABLED=${PLAN_VALIDATION_ENABLED:-true}
      # Juge LLM du plan (heuristiques déjà passées, coûteux). Clause de
      # retrait mesurée (voir docs/history.md, Itération 3) : a réellement
      # vétoté un plan que les heuristiques laissaient passer. DÉFAUT
      # INVERSÉ (docs/briefs/flags-du-coeur-cognitif.md) : décision
      # explicite de l'activer avec les 3 flags ci-dessus, la campagne
      # finale 29/33 ayant mesuré les 4 flags actifs ensemble.
      - PLAN_JUDGE_ENABLED=${PLAN_JUDGE_ENABLED:-true}
      # 5e condition du coeur cognitif (effort 2 point 3, voir
      # docs/briefs/update-plan.md "2.1 addendum") : "nodes" (défaut,
      # comportement inchangé) ou "merged" (planification fusionnée dans
      # le tour principal via l'outil manage_plan, app/graph.py).
      - PLANNING_MODE=${PLANNING_MODE:-nodes}
      # Budget de tokens dédié aux appels LLM auxiliaires (plan_task/
      # verify_action/replan_task/revise_plan/_judge_plan), SÉPARÉ de
      # LLM_MAX_TOKENS (boucle conversationnelle). Bug réel trouvé en
      # conditions réelles (voir docs/history.md, Itération 3) : Qwen3.6/TabbyAPI
      # raisonne dans reasoning_content avant de répondre, ce raisonnement
      # consommait à lui seul tout LLM_MAX_TOKENS (2048), tronquant la
      # réponse JSON systématiquement.
      - PLANNER_MAX_TOKENS=${PLANNER_MAX_TOKENS:-8192}
      # Correctif latence 2/2 (voir docs/history.md) : thinking bridé sur les
      # appels auxiliaires (plan_task/revise_plan/replan_task/_judge_plan,
      # tous via planner_llm) — TabbyAPI expose enable_thinking en
      # paramètre par requête, vérifié en direct sans effet sur la validité
      # du JSON produit. Défaut false (thinking bridé) ; override à true
      # pour revenir au comportement précédent sans redéploiement de code.
      - PLANNER_THINKING_ENABLED=${PLANNER_THINKING_ENABLED:-false}
      # Filet de sécurité (voir README, tableau des bugs) : certains modèles
      # écrivent parfois leur appel d'outil en prose au lieu d'un tool_calls
      # structuré, piégé dans le raisonnement. Nombre de relances
      # automatiques avant d'abandonner et d'afficher une notice, une fois
      # la récupération de secours (_extract_fallback_tool_call) elle-même
      # infructueuse. Budget cumulé pour toute la tâche, comme
      # MAX_TOOL_ITERATIONS.
      - MAX_EMPTY_ANSWER_RETRIES=${MAX_EMPTY_ANSWER_RETRIES:-1}
      # Plafond de tours d'outils par tâche avant la notice de limite (voir
      # app/graph.py). Pas de passthrough env avant le harnais
      # tests_integration/test_web_tasks.py (Campagne B, budget relevé pour
      # isoler l'effet du plafond des vraies capacités de navigation —
      # voir docs/benchmark-v1.md).
      - MAX_TOOL_ITERATIONS=${MAX_TOOL_ITERATIONS:-20}
      # Forfait de tokens par image dans la décomposition approximative du
      # contexte (POST /context, voir README section Observabilité) — un
      # compte exact dépendrait du tokenizer visuel du modèle servi, hors
      # périmètre pour un simple ordre de grandeur affiché sur le dashboard.
      - IMAGE_TOKEN_ESTIMATE=${IMAGE_TOKEN_ESTIMATE:-1500}
      # Ci-dessous : passthrough ajouté pour que
      # campaign_preflight.check_agent_flags() (voir tests_integration/) et
      # campaign_persistence.collect_env_flags() puissent lire la valeur
      # EFFECTIVE de ces variables via `docker exec langgraph-agent env` —
      # sans ce passthrough, une variable jamais listée ici est absente de
      # l'environnement du conteneur, quel que soit le défaut du code
      # Python (app/graph.py/approval_policy.py), rendant la vérification
      # de préambule inopérante pour elle. Défauts identiques au code.
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-2048}
      - MAX_IMAGES_IN_CONTEXT=${MAX_IMAGES_IN_CONTEXT:-1}
      - AUTO_APPROVAL_STREAK_LIMIT=${AUTO_APPROVAL_STREAK_LIMIT:-6}
      - AUTO_APPROVED_TOOLS=${AUTO_APPROVED_TOOLS:-}
      - APPROVAL_RULES_PATH=${APPROVAL_RULES_PATH:-}
      - NEVER_GRANTABLE_TOOLS_EXTRA=${NEVER_GRANTABLE_TOOLS_EXTRA:-}
      - BROWSER_TOOL_OUTPUT_MAX_CHARS=${BROWSER_TOOL_OUTPUT_MAX_CHARS:-8000}
      - AFFORDANCE_THRESHOLD=${AFFORDANCE_THRESHOLD:-60}
      - FABRICATION_LIMIT=${FABRICATION_LIMIT:-5}
      - BROWSER_NAVIGATE_GUARDRAIL=${BROWSER_NAVIGATE_GUARDRAIL:-true}
      - AUDIT_LOG_MAX_BYTES=${AUDIT_LOG_MAX_BYTES:-20971520}
      - EPISODE_COMPACTION_ENABLED=${EPISODE_COMPACTION_ENABLED:-false}
      - EPISODE_COMPACTION_TURN_THRESHOLD=${EPISODE_COMPACTION_TURN_THRESHOLD:-40}
    volumes:
      - ./workspace:/workspace
    depends_on:
      - skill-manager
      - context-manager
      - mcp-client
      - tabbyapi
    networks:
      - agent-net
    # pas de port publié : uniquement accessible via le réseau interne

  # ──────────────────────────────────────────────────────────────
  # Dashboard : cockpit d'observabilité local (voir README, section
  # Observabilité) — agrège en best-effort les métriques llama-server
  # (/metrics, /slots), la composition du contexte de langgraph-agent
  # (POST /context, GET /threads/recent) et la VRAM des GPU (nvidia-smi,
  # ENABLE_GPU_STATS). Seul service dont le port est publié sur l'hôte, à
  # part Open WebUI — tout le reste (llama-server, langgraph-agent...)
  # n'est joignable que via le réseau interne agent-net, d'où l'agrégation
  # côté backend plutôt que des appels directs depuis le navigateur.
  # ──────────────────────────────────────────────────────────────
  dashboard:
    build: ./services/dashboard
    container_name: dashboard
    restart: unless-stopped
    environment:
      # Overridable (contrairement aux autres URLs internes de ce compose,
      # toujours en dur) : llama-server n'est plus démarré par défaut depuis
      # la migration vers TabbyAPI (voir section Inférence plus bas) — cette
      # source reste en best-effort (section `null` sans erreur, voir
      # app/main.py) tant que llama-server n'est pas explicitement réactivé.
      # Pas d'équivalent /metrics/{slots} pour TabbyAPI à ce jour.
      - LLAMA_SERVER_URL=${LLAMA_SERVER_URL:-http://llama-server:8000}
      - LANGGRAPH_AGENT_URL=http://langgraph-agent:8000
      # VRAM par GPU (nvidia-smi) : désactivé par défaut, nécessite le
      # runtime nvidia (voir bloc "deploy" commenté plus bas, à décommenter
      # ensemble avec cette variable).
      - ENABLE_GPU_STATS=${ENABLE_GPU_STATS:-false}
      # Live campaign progress (docs/briefs/B2-campaign-control.md, Part
      # 1.3) : le dashboard LIT le fichier que le harnais écrit, aucun
      # canal HTTP entre les deux services (principe de conception du
      # brief) — d'où le montage plutôt qu'un appel réseau.
      - CAMPAIGNS_DIR=/campaigns
      - DURATION_ESTIMATE_CACHE_PATH=/duration-estimates.json
      # Visual feedback (docs/briefs/campaign-visual-feedback.md, minimal
      # subset) — same read-only principle: mcp-client writes, this
      # service only reads.
      - VISUAL_CAPTURE_DIR=/visual-capture
    volumes:
      - ./docs/campaigns:/campaigns:ro
      - ./services/langgraph-agent/tests_integration/DURATION_ESTIMATE_CACHE.json:/duration-estimates.json:ro
      - ./workspace/visual-capture:/visual-capture:ro
    ports:
      - "${DASHBOARD_PORT:-8090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8090/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    depends_on:
      - langgraph-agent
    networks:
      - agent-net
    # Décommenter avec ENABLE_GPU_STATS=true (.env) pour exposer nvidia-smi
    # dans ce conteneur (image python:3.12-slim, sans binaire nvidia-smi tant
    # que le runtime nvidia n'est pas déclaré ici — même mécanisme que
    # llama-server/ollama plus bas, mais optionnel pour ce service qui n'a
    # sinon besoin d'aucun accès GPU).
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]

  # ──────────────────────────────────────────────────────────────
  # Skill Manager (skills/ python, fastapi, docker, clean-code)
  # ──────────────────────────────────────────────────────────────
  skill-manager:
    build: ./services/skill-manager
    container_name: skill-manager
    restart: unless-stopped
    volumes:
      - ./skills:/app/skills:ro
    networks:
      - agent-net

  # ──────────────────────────────────────────────────────────────
  # Context Manager : RAG (LlamaIndex) / mémoire (Mem0) /
  # compression (LLMLingua) / reranking
  # ──────────────────────────────────────────────────────────────
  context-manager:
    build: ./services/context-manager
    container_name: context-manager
    restart: unless-stopped
    environment:
      - QDRANT_URL=http://qdrant:6333
      - LLM_BASE_URL=${LLM_BASE_URL:-http://tabbyapi:5000/v1}
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - agent-net

  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant
    restart: unless-stopped
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - agent-net
    # décommenter pour debug via l'UI Qdrant (http://localhost:6335/dashboard)
    # ports:
    #   - "6335:6333"

  # ──────────────────────────────────────────────────────────────
  # MCP Client : point d'entrée unique vers les serveurs MCP
  # ──────────────────────────────────────────────────────────────
  mcp-client:
    build: ./services/mcp-client
    container_name: mcp-client
    restart: unless-stopped
    environment:
      # mcp-client spawne ce conteneur à la demande via le socket Docker
      # (transport stdio, conforme à l'usage officiel des images mcp/*)
      - MCP_FILESYSTEM_IMAGE=mcp/filesystem:latest
      - WORKSPACE_HOST_PATH=${WORKSPACE_HOST_PATH}    # chemin HOTE requis par docker run -v
      # "browser" (Playwright) : serveur HTTP persistant (service
      # playwright-mcp ci-dessous), pas un spawn éphémère par appel — voir
      # docs/resolved-bugs.md (perte de continuité d'état entre deux appels d'outils).
      - MCP_PLAYWRIGHT_URL=http://playwright-mcp:8931/mcp
      # git/terminal/desktop(GhostDesk)/ocr retirés de ce registre (effort
      # 1.2, docs/briefs/update-plan.md ; docs/history.md) : schéma d'outils
      # lourd pour un usage quasi nul (44,9% du schéma pour 1,6% des appels
      # réels sur 67 threads v2). GhostDesk et ocr-service restent déployés
      # plus bas (ocr-service en dépend encore en interne) pour le
      # rebranchement de l'effort 3 (OCR en capacité du graphe), mais
      # mcp-client ne s'y connecte plus.
      # Stabilisation post-navigation (trouvé en investiguant T10, voir
      # docs/history.md « désynchronisation snapshot/URL ») : sur une page à
      # rendu client, browser_snapshot peut renvoyer le contenu de
      # l'ANCIENNE page juste après un browser_navigate/browser_click —
      # browser_wait_for est appelé automatiquement après ces deux outils
      # pour laisser le rendu se stabiliser. 0 désactive ce délai.
      - BROWSER_STABILIZE_WAIT_SECONDS=${BROWSER_STABILIZE_WAIT_SECONDS:-0.5}
      # Visual feedback (docs/briefs/campaign-visual-feedback.md, minimal
      # subset, see that file's "Status" section for the full design).
      # Off by default: overhead not yet measured (a with/without smoke
      # names the number before this default changes) — see
      # docs/history.md, "VISUAL FEEDBACK MINIMAL".
      - CAMPAIGN_VISUAL_CAPTURE=${CAMPAIGN_VISUAL_CAPTURE:-false}
      - VISUAL_CAPTURE_DIR=/visual-capture
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock   # ⚠️ équivaut à un accès root sur l'hôte,
                                                       # voir avertissement de sécurité dans le README
      - ./workspace:/workspace
      - ./workspace/visual-capture:/visual-capture
    depends_on:
      playwright-mcp:
        condition: service_healthy
    networks:
      - agent-net

  # --- Playwright MCP : navigateur piloté par l'agent (serveur HTTP) --
  # ⚠️ Anciennement spawné à la demande par mcp-client (`docker run --rm`
  # par appel d'outil) : chaque appel repartait sur `about:blank` sans
  # continuité d'état avec le précédent (voir docs/resolved-bugs.md). L'image officielle
  # mcp/playwright supporte un mode serveur HTTP natif (`--port`, endpoint
  # Streamable HTTP `/mcp`) ; on l'utilise ici comme service persistant,
  # même patron que GhostDesk/OCR plus bas (déployés mais plus enregistrés
  # dans mcp-client, voir effort 1.2/3, docs/briefs/update-plan.md).
  # Un volume nommé Docker est créé root:root par défaut ; l'image
  # mcp/playwright tourne en "node" (uid 1000), qui ne peut donc PAS écrire
  # dans /downloads sans ce correctif — constaté en conditions réelles
  # (browser_navigate échouait systématiquement en EACCES en tentant
  # d'écrire son propre snapshot de debug page-*.yml sous --output-dir,
  # voir docs/history.md "Phase 1d-révisée", vérification post-déploiement T5).
  # Tourne une fois avant playwright-mcp (condition
  # service_completed_successfully), jamais en continu.
  agent-downloads-init:
    image: busybox
    container_name: agent-downloads-init
    command: ["chown", "-R", "1000:1000", "/downloads"]
    volumes:
      - agent-downloads:/downloads
    restart: "no"

  playwright-mcp:
    image: mcp/playwright:latest
    container_name: playwright-mcp
    restart: unless-stopped
    depends_on:
      agent-downloads-init:
        condition: service_completed_successfully
    command:
      - --host=0.0.0.0
      - --port=8931
      # Host header attendu = nom DNS docker-compose du service : évite le
      # 403 par défaut (l'image ne sert que "localhost:<port>" sinon), sans
      # ouvrir à '*' puisque ce service n'est joignable que sur agent-net.
      - --allowed-hosts=playwright-mcp:8931
      - --isolated   # profil navigateur en mémoire, jamais persisté sur disque
      - --headless
      - --browser=chromium
      # Chemin EXPLICITE (voir docs/history.md "Phase 1d-révisée", T5) plutôt que
      # le défaut implicite (~/.playwright-mcp du conteneur) — l'agent
      # fabriquait régulièrement de mauvais chemins en devinant ce défaut
      # (/app/.playwright-mcp, /.playwright-mcp...), jamais le vrai. Partagé
      # en LECTURE SEULE avec le serveur MCP filesystem ci-dessous (volume
      # agent-downloads) : on partage l'artefact téléchargé, jamais l'état du
      # profil navigateur (--isolated reste actif).
      - --output-dir=/downloads
    volumes:
      - agent-downloads:/downloads
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/8931' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - agent-net
    # pas de port publié : uniquement accessible via le réseau interne (mcp-client)

  # --- GhostDesk : bureau virtuel complet piloté par l'agent ------
  # ⚠️ Surface d'attaque large : SYS_ADMIN + exécution shell + contrôle
  # GUI complet. Reste un serveur MCP HTTP
  # persistant avec état (pas un conteneur éphémère comme les autres) ;
  # voir avertissement détaillé et limites assumées dans le README.
  ghostdesk:
    image: ghcr.io/yv17labs/ghostdesk:latest
    container_name: ghostdesk
    restart: unless-stopped
    shm_size: 2gb
    cap_add:
      - SYS_ADMIN   # requis par Electron/apps complexes dans le bureau virtuel
    environment:
      - GHOSTDESK_AUTH_TOKEN=${GHOSTDESK_AUTH_TOKEN}
      - GHOSTDESK_VNC_PASSWORD=${GHOSTDESK_VNC_PASSWORD}
    volumes:
      - ghostdesk-home:/home/agent   # persiste le bureau/apps entre redémarrages
    ports:
      - "6080:6080"   # noVNC — exposé par défaut pour observer l'agent piloter le bureau
    healthcheck:
      # Port MCP (3000, voir plus bas) : ocr-service en dépend (condition
      # service_healthy) pour ne capturer qu'une fois GhostDesk réellement prêt
      # à répondre, pas seulement démarré (depends_on seul ne garantit que
      # l'ordre de démarrage des conteneurs, voir README tableau des bugs pour
      # un précédent similaire avec Qdrant).
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/3000' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - agent-net
    # Port MCP (3000) volontairement non publié sur l'hôte : seul
    # ocr-service doit l'atteindre, via le réseau interne agent-net —
    # mcp-client ne s'y connecte plus (effort 1.2, docs/briefs/update-plan.md).

  # --- OCR d'appoint : PaddleOCR CPU (find_text/read_screen) ------
  # Grounding du VLM (Qwen3.6 MoE) : raisonne bien mais localise mal un
  # élément à l'écran (sans OCR/détection d'éléments UI dédiée, voir README
  # section OCR d'appoint et Limites connues assumées). Serveur MCP HTTP
  # déployé mais plus enregistré dans mcp-client (effort 1.2) : dormant
  # jusqu'au rebranchement prévu par l'effort 3 (capacité du graphe plutôt
  # qu'outil appelable par le modèle) — se connecte lui-même à GhostDesk
  # pour capturer l'écran, indépendamment de mcp-client/langgraph-agent.
  ocr-service:
    build: ./services/ocr-service
    container_name: ocr-service
    restart: unless-stopped
    environment:
      - MCP_GHOSTDESK_URL=http://ghostdesk:3000/mcp
      - GHOSTDESK_AUTH_TOKEN=${GHOSTDESK_AUTH_TOKEN}
      - OCR_AUTH_TOKEN=${OCR_AUTH_TOKEN}
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health', timeout=3)\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    depends_on:
      ghostdesk:
        condition: service_healthy
    networks:
      - agent-net
    # pas de port publié : uniquement accessible via le réseau interne agent-net

  # ──────────────────────────────────────────────────────────────
  # Inférence
  # ──────────────────────────────────────────────────────────────
  # Backend par défaut : TabbyAPI (image officielle ghcr.io/theroyallab/
  # tabbyapi, backend ExLlamaV3) servant Qwen3.6-27B en quantisation EXL3
  # (variante VL, vision préservée pour browser_take_screenshot) avec MTP natif
  # (draft_mode: mtp dans services/tabbyapi/config.yml, pas de modèle de
  # draft séparé). Remplace llama-server comme défaut : ce dernier restait
  # bloqué par un bug de synchronisation inter-GPU confirmé dans son fork
  # (voir tests_integration/CUDA-DIAGNOSTIC.md), nécessitant
  # --ubatch-size 128 (~+34% de latence) en mitigation permanente.
  # Multi-GPU (count: all, les deux cartes) : un mono-GPU a été tenté
  # d'abord (contournait le tensor-split hétérogène du fork llama.cpp en le
  # rendant sans objet plutôt que de le réparer) mais ce quant VL 3.50bpw
  # (14,29 Gio de poids seuls + tour vision) ne rentre pas avec la vision
  # activée sur un seul GPU 16 Go, même sur la Blackwell (marge ~822 Mio
  # sans vision). ExLlamaV3 étant un code base différent du fork llama.cpp
  # diagnostiqué, le bug de synchronisation inter-GPU documenté n'a pas de
  # raison de s'y appliquer. llama-server reste disponible comme backend
  # alternatif plus bas (même statut qu'Ollama).
  tabbyapi:
    # Build local minimal (voir services/tabbyapi/Dockerfile) au-dessus de
    # l'image officielle épinglée par digest (":latest" est une rolling
    # release qui ne fige rien dans le temps ; digest résolu et versions
    # réelles constatées dans le conteneur consignées dans RESULTS.md) —
    # ajoute python3-dev, absent de l'image officielle et requis par la
    # compilation JIT Triton au chargement du modèle.
    build: ./services/tabbyapi
    container_name: tabbyapi
    restart: unless-stopped
    environment:
      # Ordre PCI stable (sinon l'ordre CUDA n'est pas garanti d'un
      # redémarrage à l'autre) — voir
      # docs/briefs/deterministic-gpu-placement.md. Lu à l'initialisation
      # CUDA : un --force-recreate est nécessaire, un simple restart ne
      # suffit pas.
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
    # Explicite plutôt que de dépendre du défaut du daemon Docker de l'hôte
    # (souvent plus restrictif, ex. Desktop Linux : max-size 20m/max-file 5,
    # ~100 Mio — insuffisant pour garder les lignes "tokens generated"
    # exploitées par tests_integration/campaign_persistence.py sur une
    # campagne complète) : ces logs sont la SEULE source réelle de
    # performance par requête pour TabbyAPI (pas d'endpoint /metrics, voir
    # campaign_persistence.py) — les perdre au gré du daemon invaliderait
    # silencieusement `collect_tabbyapi_raw_samples` sur les runs les plus
    # anciens d'une campagne. Toujours borné (pas de croissance infinie) :
    # ~1 Gio cumulé, plusieurs campagnes complètes de marge.
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "10"
    volumes:
      - ./services/tabbyapi/config.yml:/app/config.yml:ro
      - ${MODELS_HOST_PATH:-./models}:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              # Choix revu en cours de PoC : mono-GPU (Ada, puis Blackwell)
              # insuffisant pour ce quant avec vision activée (14,29 Gio de
              # poids seuls + tour vision + buffers — restait ~822 Mio de
              # marge SANS vision même sur la Blackwell à cache_size=8192,
              # largement insuffisant pour la tour vision). Passage en
              # multi-GPU (les deux cartes, count: all) pour ce backend —
              # ExLlamaV3, pas le fork llama.cpp diagnostiqué précédemment,
              # le bug de synchronisation inter-GPU documenté dans
              # tests_integration/CUDA-DIAGNOSTIC.md n'a pas de raison de
              # s'appliquer ici (code base différent). gpu_split_auto
              # (défaut TabbyAPI, voir config.yml) répartit automatiquement
              # entre les deux GPU visibles.
              count: all
              capabilities: [gpu]
    networks:
      - agent-net
    # décommenter pour exposer l'API OpenAI-compatible directement sur l'hôte
    # ports:
    #   - "5000:5000"

  # ──────────────────────────────────────────────────────────────
  # Fixtures Benchmark 0 (plan d'autonomie, voir PLAN.md et
  # docs/benchmark-v1.md) : sites/app auto-hébergés à vérité
  # terrain connue par construction, ciblés par le harnais
  # test_web_tasks.py (T1-T7). Profil dédié : ne tournent jamais par défaut
  # avec le reste de la stack, seulement quand on lance ce harnais.
  #   docker compose --profile test-fixtures up -d fixture-catalog fixture-docs fixture-hr-app
  # ──────────────────────────────────────────────────────────────
  fixture-catalog:
    build: ./services/langgraph-agent/tests_integration/fixtures/catalog
    container_name: fixture-catalog
    profiles: ["test-fixtures"]
    networks:
      - agent-net
    # pas de port publié : seul le conteneur playwright-mcp (agent-net) y accède

  fixture-docs:
    build: ./services/langgraph-agent/tests_integration/fixtures/docs
    container_name: fixture-docs
    profiles: ["test-fixtures"]
    networks:
      - agent-net

  fixture-perception:
    build: ./services/langgraph-agent/tests_integration/fixtures/perception
    container_name: fixture-perception
    profiles: ["test-fixtures"]
    networks:
      - agent-net

  # Sonde de faisabilité canal visuel (docs/briefs/update-plan.md effort 3,
  # préalable au retrait de GhostDesk) : session technique, jamais mesurée
  # comme capacité agent — voir docs/architecture/visual-channel-feasibility.md.
  fixture-visual-probe:
    build: ./services/langgraph-agent/tests_integration/fixtures/visual-probe
    container_name: fixture-visual-probe
    profiles: ["test-fixtures"]
    networks:
      - agent-net

  fixture-hr-app:
    build: ./services/langgraph-agent/tests_integration/fixtures/hr-app
    container_name: fixture-hr-app
    profiles: ["test-fixtures"]
    environment:
      # court délibérément (voir T6, docs/benchmark-v1.md) : teste que l'agent reste
      # efficace dans sa trajectoire plutôt que d'errer avant de répondre.
      - HR_APP_SESSION_TIMEOUT_SECONDS=${HR_APP_SESSION_TIMEOUT_SECONDS:-90}
    volumes:
      # soumissions du formulaire de congé (T2) : écrites ici par l'app,
      # lues par les assertions du harnais depuis l'hôte, jamais par l'app
      # elle-même après écriture.
      - ./workspace/hr-app-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - agent-net

  fixture-admin:
    build: ./services/langgraph-agent/tests_integration/fixtures/admin
    container_name: fixture-admin
    profiles: ["test-fixtures"]
    volumes:
      # mises à jour de stock (famille B, intent β) : écrites ici par
      # l'app, lues par les assertions du harnais depuis l'hôte, jamais
      # par l'app elle-même après écriture — même convention que
      # fixture-hr-app.
      - ./workspace/admin-app-data:/data
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=3)\" || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - agent-net

networks:
  agent-net:
    driver: bridge

volumes:
  open-webui-data:
  qdrant-data:
  ghostdesk-home:
  # Volume PARTAGÉ entre playwright-mcp (écriture) et le serveur MCP
  # filesystem spawné par mcp-client (lecture seule) — voir playwright-mcp
  # (--output-dir) et services/mcp-client/app/main.py (SERVERS["filesystem"])
  # ci-dessous, docs/history.md "Phase 1d-révisée" (T5). On partage les
  # ARTEFACTS de téléchargement, jamais l'état du navigateur : playwright-mcp
  # reste --isolated (profil en mémoire, jamais persisté).
  #
  # `name:` FIXE (pas de préfixe de projet compose) : mcp-client spawne le
  # serveur filesystem via `docker run` BRUT sur le socket hôte (voir
  # services/mcp-client/app/main.py), un appel totalement extérieur à ce
  # fichier compose — le préfixage automatique "<projet>_agent-downloads"
  # ne s'applique QUE quand Docker Compose résout lui-même le nom depuis ce
  # fichier (ex. le volume de playwright-mcp ci-dessus). Sans ce `name:`
  # explicite, les deux services pointaient vers deux volumes DIFFÉRENTS
  # (celui, vide, que `docker run` créait implicitement sous le nom littéral
  # "agent-downloads") — bug constaté en conditions réelles : le fichier
  # téléchargé existait bien côté playwright-mcp mais `read_file` échouait
  # en ENOENT côté filesystem-MCP (voir docs/history.md, vérification
  # post-déploiement T5).
  agent-downloads:
    name: agent-downloads