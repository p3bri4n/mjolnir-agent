name: qwen38-test

services:
  tabbyapi:
    build: .
    image: qwen38-tabbyapi-patched
    container_name: qwen38-tabbyapi
    environment:
      - CUDA_DEVICE_ORDER=PCI_BUS_ID
      - NAME=TabbyAPI
    volumes:
      - /run/media/pebrian/Data/Projects/mjolnir-agent/models/qwen3.8-27b-exl3-4.50bpw:/models/qwen38:ro
      - ./config.yml:/app/config.yml:ro
    ports:
      - "5001:5000"          # port distinct de ta stack
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]